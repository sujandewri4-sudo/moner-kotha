<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="30%" stop-color="#b91c1c"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="redAwning" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="bananaLeaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="50%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </linearGradient>
    <linearGradient id="bananaLeaf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="60%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="redLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#b91c1c"/>
      <stop offset="85%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="30%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Golden Sun Bloom (top left / ambient) -->
  <circle cx="200" cy="100" r="380" fill="url(#sunGlow)"/>

  <!-- Distant Indian town building silhouette & coconut palm -->
  <rect x="1250" y="0" width="180" height="90" fill="#ca8a04" opacity="0.3"/>
  <rect x="1280" y="20" width="80" height="40" fill="#a16207" opacity="0.4"/>
  <path d="M1520 80 Q1530 20 1560 0 Q1590 20 1600 80" stroke="#166534" stroke-width="6" fill="none" opacity="0.5"/>
  <path d="M1540 80 Q1500 30 1460 30" stroke="#166534" stroke-width="5" fill="none" opacity="0.5"/>

  <!-- Ground -->
  <rect x="0" y="880" width="1920" height="200" fill="url(#groundGrad)"/>

  <!-- Main Red Brick Building -->
  <rect x="180" y="80" width="1280" height="840" fill="url(#redWall)"/>
  <!-- Brick Pattern overlay lines -->
  <g stroke="#7f1d1d" stroke-width="3" opacity="0.45">
    <!-- Horizontal mortar lines -->
    <line x1="180" y1="120" x2="1460" y2="120"/>
    <line x1="180" y1="160" x2="1460" y2="160"/>
    <line x1="180" y1="200" x2="1460" y2="200"/>
    <line x1="180" y1="240" x2="1460" y2="240"/>
    <line x1="180" y1="280" x2="1460" y2="280"/>
    <line x1="180" y1="320" x2="1460" y2="320"/>
    <line x1="180" y1="360" x2="1460" y2="360"/>
    <line x1="180" y1="400" x2="1460" y2="400"/>
    <line x1="180" y1="440" x2="1460" y2="440"/>
    <line x1="180" y1="480" x2="1460" y2="480"/>
    <line x1="180" y1="520" x2="1460" y2="520"/>
    <line x1="180" y1="560" x2="1460" y2="560"/>
    <line x1="180" y1="600" x2="1460" y2="600"/>
    <line x1="180" y1="640" x2="1460" y2="640"/>
    <line x1="180" y1="680" x2="1460" y2="680"/>
    <line x1="180" y1="720" x2="1460" y2="720"/>
    <line x1="180" y1="760" x2="1460" y2="760"/>
    <line x1="180" y1="800" x2="1460" y2="800"/>
    <line x1="180" y1="840" x2="1460" y2="840"/>
    <line x1="180" y1="880" x2="1460" y2="880"/>
  </g>

  <!-- Weathered Peeling Plaster Patches on Red Wall -->
  <path d="M940 180 Q1020 140 1060 220 Q1080 340 980 390 Q920 330 940 180 Z" fill="#e2d6c3" opacity="0.6"/>
  <path d="M1200 320 Q1280 290 1340 370 Q1300 480 1220 440 Z" fill="#ecdcc7" opacity="0.55"/>
  <path d="M1100 560 Q1190 530 1260 620 Q1200 700 1120 660 Z" fill="#ecdcc7" opacity="0.5"/>

  <!-- Left: Indian Tea Stall Kiosk Counter & Entrance -->
  <rect x="220" y="270" width="700" height="650" fill="#1e293b"/>
  <!-- Blue doorframe of the shop -->
  <rect x="230" y="280" width="680" height="630" fill="#0f172a" stroke="#2563eb" stroke-width="12"/>

  <!-- Corrugated tin roof shed overhang over the shop -->
  <path d="M140 60 L1520 60 L1500 100 L140 100 Z" fill="#71717a" stroke="#3f3f46" stroke-width="4"/>
  <g stroke="#52525b" stroke-width="3">
    <line x1="200" y1="60" x2="200" y2="100"/>
    <line x1="300" y1="60" x2="300" y2="100"/>
    <line x1="400" y1="60" x2="400" y2="100"/>
    <line x1="500" y1="60" x2="500" y2="100"/>
    <line x1="600" y1="60" x2="600" y2="100"/>
    <line x1="700" y1="60" x2="700" y2="100"/>
    <line x1="800" y1="60" x2="800" y2="100"/>
    <line x1="900" y1="60" x2="900" y2="100"/>
    <line x1="1000" y1="60" x2="1000" y2="100"/>
    <line x1="1100" y1="60" x2="1100" y2="100"/>
    <line x1="1200" y1="60" x2="1200" y2="100"/>
    <line x1="1300" y1="60" x2="1300" y2="100"/>
    <line x1="1400" y1="60" x2="1400" y2="100"/>
  </g>

  <!-- Left Stall Red Fabric Awning Canopy -->
  <path d="M0 110 L460 110 L440 330 L0 310 Z" fill="url(#redAwning)"/>
  <path d="M0 110 L460 110 L420 220 L0 180 Z" fill="#dc2626" opacity="0.4"/>
  <g stroke="#991b1b" stroke-width="5">
    <line x1="70" y1="110" x2="60" y2="315"/>
    <line x1="160" y1="110" x2="145" y2="320"/>
    <line x1="260" y1="110" x2="245" y2="325"/>
    <line x1="360" y1="110" x2="345" y2="328"/>
  </g>

  <!-- Tea stall sign: "চা 25/-" (Bengali for Tea 25/-) -->
  <rect x="225" y="380" width="90" height="95" rx="4" fill="#fafaf9" stroke="#d6d3d1" stroke-width="3"/>
  <text x="270" y="435" font-family="sans-serif" font-size="44" font-weight="bold" fill="#b91c1c" text-anchor="middle">চা</text>
  <text x="270" y="465" font-family="sans-serif" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">25/-</text>

  <!-- Tea stall wooden table & jars on the left -->
  <rect x="0" y="590" width="360" height="350" fill="#5c2c16" stroke="#3b1a0d" stroke-width="4"/>
  <!-- Wooden bench -->
  <rect x="350" y="810" width="260" height="150" fill="#78350f" stroke="#451a03" stroke-width="5"/>
  <!-- Jars, steel kettle, snack packets on table -->
  <rect x="50" y="840" width="150" height="90" rx="6" fill="#0284c7" stroke="#0369a1" stroke-width="4"/>
  <circle cx="160" cy="580" r="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
  <rect x="210" y="550" width="45" height="55" rx="6" fill="#cbd5e1" opacity="0.8"/>

  <!-- Hanging warm bulb in the stall -->
  <line x1="700" y1="280" x2="700" y2="390" stroke="#1e293b" stroke-width="4"/>
  <circle cx="700" cy="405" r="18" fill="#fef08a" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="700" cy="405" r="50" fill="#fef08a" opacity="0.25"/>

  <!-- Right: Lush Green Banana Trees -->
  <!-- Tree 1 -->
  <path d="M1650 920 Q1620 450 1560 220 Q1420 180 1340 260 Q1460 360 1620 620" fill="url(#bananaLeaf1)"/>
  <path d="M1680 920 Q1740 500 1780 280 Q1920 220 1960 380 Q1850 560 1700 780" fill="url(#bananaLeaf2)"/>
  <path d="M1660 700 Q1520 400 1480 320 Q1400 370 1450 480 Q1540 550 1650 680" fill="url(#bananaLeaf1)"/>
  <path d="M1720 850 Q1800 600 1880 480 Q1950 560 1890 680 Q1800 780 1730 880" fill="url(#bananaLeaf2)"/>
  <path d="M1600 950 Q1550 750 1520 620 Q1440 680 1480 780 Q1540 850 1590 950" fill="url(#bananaLeaf1)"/>
  <!-- Banana leaf ribs -->
  <path d="M1650 920 Q1600 500 1450 250" stroke="#fef08a" stroke-width="5" fill="none" opacity="0.6"/>
  <path d="M1680 920 Q1760 550 1870 300" stroke="#fef08a" stroke-width="5" fill="none" opacity="0.6"/>

  <!-- Vintage Black Road Bicycle on the right -->
  <!-- Rear wheel -->
  <circle cx="1860" cy="850" r="110" stroke="#334155" stroke-width="12" fill="none"/>
  <!-- Spokes -->
  <line x1="1860" y1="740" x2="1860" y2="960" stroke="#64748b" stroke-width="2"/>
  <line x1="1750" y1="850" x2="1970" y2="850" stroke="#64748b" stroke-width="2"/>
  <!-- Bicycle frame -->
  <line x1="1860" y1="850" x2="1780" y2="780" stroke="#0f172a" stroke-width="10"/>
  <line x1="1780" y1="780" x2="1820" y2="720" stroke="#0f172a" stroke-width="10"/>

  <!-- Centerpiece: Vintage Red Leather & Chrome Salon / Barber Chair -->
  <!-- Cast shadow of the chair & person -->
  <ellipse cx="980" cy="980" rx="240" ry="40" fill="#000000" opacity="0.5" filter="url(#shadowBlur)"/>

  <!-- Hydraulic Chrome Base -->
  <ellipse cx="940" cy="950" rx="140" ry="24" fill="url(#chromeGrad)" stroke="#64748b" stroke-width="4"/>
  <rect x="915" y="780" width="50" height="170" fill="url(#chromeGrad)" stroke="#475569" stroke-width="3"/>
  <!-- Footrest mechanism -->
  <rect x="960" y="870" width="160" height="18" rx="6" fill="url(#chromeGrad)" stroke="#475569" stroke-width="3"/>
  <rect x="1080" y="850" width="70" height="40" rx="4" fill="#1e293b"/>

  <!-- Chair Red Leather Seat -->
  <path d="M780 730 L1110 700 L1100 780 L790 800 Z" fill="url(#redLeather)" stroke="#450a0a" stroke-width="4"/>
  <!-- Chair Red Leather Backrest -->
  <path d="M740 520 L870 510 L880 730 L760 740 Z" fill="url(#redLeather)" stroke="#450a0a" stroke-width="4"/>
  <!-- Red Headrest / Armrest -->
  <rect x="750" y="600" width="140" height="28" rx="8" fill="url(#redLeather)" stroke="#450a0a" stroke-width="3"/>

  <!-- The Stylish Young Indian Man -->
  <!-- Legs (crossed) - dark trousers & clean white sneakers -->
  <!-- Left Leg (foot resting) -->
  <path d="M880 680 Q930 730 960 840 Q970 890 980 920" stroke="#1e293b" stroke-width="65" stroke-linecap="round" fill="none"/>
  <!-- Right Leg (crossed over left knee) -->
  <path d="M880 670 Q980 640 1080 690 Q1180 740 1260 730" stroke="#0f172a" stroke-width="60" stroke-linecap="round" fill="none"/>
  <!-- White sneakers -->
  <ellipse cx="1060" cy="920" rx="65" ry="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
  <ellipse cx="1270" cy="735" rx="65" ry="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Torso - Light off-white / beige casual collared shirt -->
  <path d="M840 500 Q910 490 940 540 Q940 680 870 690 Q810 650 830 520 Z" fill="#e2d6c3" stroke="#d5c3ab" stroke-width="3"/>
  <path d="M870 510 L880 680" stroke="#b8a892" stroke-width="2"/>

  <!-- Left Arm (resting along body) -->
  <path d="M840 510 Q790 560 780 680" stroke="#e2d6c3" stroke-width="38" stroke-linecap="round" fill="none"/>

  <!-- Right Arm (reaching up, hand thoughtfully touching chin) -->
  <path d="M920 520 Q990 540 1010 480 Q960 450 930 435" stroke="#e2d6c3" stroke-width="36" stroke-linecap="round" fill="none"/>
  <!-- Hand on chin -->
  <circle cx="945" cy="450" r="22" fill="#c68b59"/>

  <!-- Neck & Face (profile / three-quarter looking up thoughtfully) -->
  <rect x="880" y="440" width="36" height="50" fill="#c68b59"/>
  <ellipse cx="900" cy="420" rx="42" ry="48" fill="#c68b59"/>
  <!-- Sharp jawline -->
  <path d="M880 440 L935 440 L920 400" stroke="#8c582f" stroke-width="3" fill="none"/>

  <!-- Black Sunglasses -->
  <ellipse cx="915" cy="415" rx="16" ry="11" fill="#09090b" stroke="#18181b" stroke-width="3"/>
  <line x1="885" y1="412" x2="935" y2="415" stroke="#18181b" stroke-width="3"/>

  <!-- Stylish Dark Hair -->
  <path d="M860 410 Q850 350 900 355 Q940 360 945 400 Q920 375 880 380 Z" fill="#09090b"/>

  <!-- Golden hour cinematic warm light wash -->
  <rect width="1920" height="1080" fill="url(#sunGlow)" opacity="0.3" pointer-events="none"/>
  <!-- Film Grain / Vignette effect -->
  <radialGradient id="filmVignette" cx="50%" cy="50%" r="50%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="95%" stop-color="#000" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#filmVignette)" pointer-events="none"/>
</svg>