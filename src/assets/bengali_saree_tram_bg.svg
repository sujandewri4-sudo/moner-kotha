<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Sky & Urban Atmosphere -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Warm Golden Ambient Sunlight -->
    <radialGradient id="goldenSunGlow" cx="25%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#fed7aa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0"/>
    </radialGradient>

    <!-- Vintage Tram Green Gradients -->
    <linearGradient id="tramBodyGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#557c55"/>
      <stop offset="25%" stop-color="#698f69"/>
      <stop offset="70%" stop-color="#507350"/>
      <stop offset="100%" stop-color="#3c573c"/>
    </linearGradient>

    <linearGradient id="tramCreamWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Mustard Yellow Saree Gradient -->
    <linearGradient id="sareeYellow" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fba16c"/>
    </linearGradient>

    <!-- Hair Tone -->
    <linearGradient id="hairDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="50%" stop-color="#121217"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Jute Sling Bag Texture -->
    <linearGradient id="bagGrey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="60%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Figure and Tram -->
    <filter id="stickerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="softCityBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>
  <rect width="1920" height="1080" fill="url(#goldenSunGlow)"/>

  <!-- Background Nostalgic City Shapes (Minimalist Editorial Silhouette) -->
  <g filter="url(#softCityBlur)" opacity="0.75">
    <!-- Tall Urban Buildings Left -->
    <rect x="120" y="240" width="180" height="700" fill="#94a3b8"/>
    <rect x="260" y="160" width="150" height="780" fill="#a1a1aa"/>
    <rect x="380" y="320" width="160" height="620" fill="#cbd5e1"/>
    
    <!-- Pastel Green Architectural Column -->
    <rect x="180" y="220" width="110" height="720" fill="#86efac" opacity="0.45"/>
    <rect x="420" y="280" width="90" height="660" fill="#a7f3d0" opacity="0.35"/>

    <!-- Subtle Distant Trees & Wires -->
    <path d="M 0 780 Q 250 760 600 790 T 1100 810 L 1100 950 L 0 950 Z" fill="#64748b" opacity="0.5"/>
  </g>

  <!-- Distant Ground/Street Surface -->
  <rect x="0" y="820" width="1920" height="260" fill="#94a3b8" opacity="0.85"/>
  <path d="M 0 850 Q 500 820 1000 860 T 1920 840 L 1920 1080 L 0 1080 Z" fill="#64748b"/>

  <!-- Right Heritage Green & White Kolkata Tram Structure -->
  <g id="heritage-tram">
    <!-- Tram Main Green Body -->
    <polygon points="980,100 1920,80 1920,1080 940,1080" fill="url(#tramBodyGreen)"/>
    
    <!-- Upper White/Cream Belt & Roofline -->
    <polygon points="980,100 1920,80 1920,380 960,390" fill="url(#tramCreamWhite)"/>
    <polygon points="975,80 1920,60 1920,120 980,130" fill="#475569"/>

    <!-- Tram Windows with Protective Safety Metal Bars -->
    <!-- Window 1 -->
    <rect x="1080" y="140" width="180" height="210" rx="8" fill="#1e293b"/>
    <rect x="1088" y="148" width="164" height="194" rx="6" fill="#334155" opacity="0.8"/>
    <!-- Safety Horizontal Bars -->
    <line x1="1070" y1="180" x2="1270" y2="180" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <line x1="1065" y1="230" x2="1275" y2="230" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <line x1="1060" y1="280" x2="1280" y2="280" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>

    <!-- Window 2 -->
    <rect x="1340" y="130" width="190" height="210" rx="8" fill="#1e293b"/>
    <rect x="1348" y="138" width="174" height="194" rx="6" fill="#334155" opacity="0.8"/>
    <line x1="1330" y1="170" x2="1540" y2="170" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <line x1="1325" y1="220" x2="1545" y2="220" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <line x1="1320" y1="270" x2="1550" y2="270" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>

    <!-- Window 3 -->
    <rect x="1610" y="120" width="200" height="210" rx="8" fill="#1e293b"/>
    <rect x="1618" y="128" width="184" height="194" rx="6" fill="#334155" opacity="0.8"/>
    <line x1="1600" y1="160" x2="1820" y2="160" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <line x1="1595" y1="210" x2="1825" y2="210" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <line x1="1590" y1="260" x2="1830" y2="260" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>

    <!-- Tram Handrail Chrome Pipe Bar -->
    <line x1="950" y1="410" x2="1920" y2="395" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>
    <line x1="950" y1="410" x2="1920" y2="395" stroke="#94a3b8" stroke-width="4"/>

    <!-- Tram Soft Passenger Silhouette / Shadow Reflection -->
    <path d="M 1480 430 Q 1550 410 1620 460 Q 1660 520 1640 680 Q 1610 840 1520 890 Z" fill="#3b5e3b" opacity="0.6"/>
  </g>

  <!-- The Graceful Bengali Girl in Mustard Yellow Saree with Sunflower & Jute Bag -->
  <!-- Encased in pristine white sticker contour contouring the character silhouette as in reference -->
  <g id="bengali-woman-saree" filter="url(#stickerGlow)" transform="translate(100, 0)">
    
    <!-- White Sticker Contour Backing Silhouette -->
    <path d="
      M 940 310
      C 900 290 850 320 830 360
      C 800 420 820 460 760 480
      C 690 510 650 560 630 640
      C 610 730 650 820 680 910
      C 720 1020 790 1080 870 1080
      C 1050 1080 1350 1080 1480 1080
      C 1520 980 1540 850 1510 740
      C 1480 630 1410 540 1340 480
      C 1260 440 1200 390 1150 320
      C 1090 280 1010 270 940 310 Z"
      fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round"
    />

    <!-- Main Yellow Marigold Saree Body -->
    <path d="
      M 860 450
      C 800 490 730 550 710 650
      C 690 740 730 850 770 950
      C 810 1020 870 1080 950 1080
      C 1140 1080 1380 1080 1460 1080
      C 1490 920 1500 780 1460 660
      C 1420 540 1350 490 1250 470
      C 1180 460 1120 480 1050 470
      C 970 460 910 440 860 450 Z"
      fill="url(#sareeYellow)"
    />

    <!-- Traditional Bengali White Block-Printed Feather / Leaf Patterns -->
    <g fill="#ffffff" opacity="0.92">
      <!-- Saree Motifs row 1 -->
      <path d="M 880 540 Q 900 520 910 545 Q 890 560 880 540 Z M 895 530 L 905 555"/>
      <path d="M 980 520 Q 1000 500 1010 525 Q 990 540 980 520 Z M 995 510 L 1005 535"/>
      <path d="M 1120 510 Q 1140 490 1150 515 Q 1130 530 1120 510 Z"/>
      <path d="M 1240 530 Q 1260 510 1270 535 Q 1250 550 1240 530 Z"/>

      <!-- Saree Motifs row 2 -->
      <path d="M 830 620 Q 850 600 860 625 Q 840 640 830 620 Z"/>
      <path d="M 940 610 Q 960 590 970 615 Q 950 630 940 610 Z"/>
      <path d="M 1060 600 Q 1080 580 1090 605 Q 1070 620 1060 600 Z"/>
      <path d="M 1180 610 Q 1200 590 1210 615 Q 1190 630 1180 610 Z"/>
      <path d="M 1320 620 Q 1340 600 1350 625 Q 1330 640 1320 620 Z"/>

      <!-- Saree Motifs row 3 -->
      <path d="M 790 720 Q 810 700 820 725 Q 800 740 790 720 Z"/>
      <path d="M 900 710 Q 920 690 930 715 Q 910 730 900 710 Z"/>
      <path d="M 1030 700 Q 1050 680 1060 705 Q 1040 720 1030 700 Z"/>
      <path d="M 1170 710 Q 1190 690 1200 715 Q 1180 730 1170 710 Z"/>
      <path d="M 1360 720 Q 1380 700 1390 725 Q 1370 740 1360 720 Z"/>

      <!-- Saree Motifs row 4 -->
      <path d="M 840 830 Q 860 810 870 835 Q 850 850 840 830 Z"/>
      <path d="M 960 820 Q 980 800 990 825 Q 970 840 960 820 Z"/>
      <path d="M 1100 810 Q 1120 790 1130 815 Q 1110 830 1100 810 Z"/>
      <path d="M 1250 830 Q 1270 810 1280 835 Q 1260 850 1250 830 Z"/>

      <!-- Saree Motifs row 5 (Pleats) -->
      <path d="M 910 930 Q 930 910 940 935 Q 920 950 910 930 Z"/>
      <path d="M 1040 920 Q 1060 900 1070 925 Q 1050 940 1040 920 Z"/>
      <path d="M 1190 925 Q 1210 905 1220 930 Q 1200 945 1190 925 Z"/>
      <path d="M 1320 940 Q 1340 920 1350 945 Q 1330 960 1320 940 Z"/>
    </g>

    <!-- Graceful Hand Grasping Saree Pleats -->
    <g id="hand-pleats">
      <path d="
        M 1060 760
        Q 1040 820 1030 870
        Q 1045 885 1060 860
        Q 1080 885 1095 850
        Q 1110 875 1125 840
        Q 1115 780 1100 750 Z"
        fill="url(#skinTone)" stroke="#c2410c" stroke-width="2"
      />
      <!-- Silver Ring -->
      <ellipse cx="1046" cy="858" rx="4" ry="2" fill="#e2e8f0"/>
      <!-- Wrist Watch with Green Dial -->
      <rect x="1070" y="740" width="30" height="24" rx="5" fill="#334155"/>
      <circle cx="1085" cy="752" r="9" fill="#15803d" stroke="#e2e8f0" stroke-width="2"/>
    </g>

    <!-- Left Arm & Silver Glass Bangles -->
    <g id="left-arm">
      <path d="
        M 860 440
        C 800 480 730 520 700 580
        C 730 600 780 570 820 520
        C 860 480 880 460 860 440 Z"
        fill="url(#skinTone)" stroke="#c2410c" stroke-width="1.5"
      />
      <!-- Blouse White Cotton Sleeve -->
      <path d="M 830 460 Q 860 430 890 480 Q 850 510 830 460 Z" fill="#f8fafc"/>
      <!-- Silver Glass Bangles Stack -->
      <g stroke="#e2e8f0" stroke-width="2.5" fill="none">
        <line x1="730" y1="530" x2="760" y2="505"/>
        <line x1="735" y1="535" x2="765" y2="510"/>
        <line x1="740" y1="540" x2="770" y2="515"/>
        <line x1="745" y1="545" x2="775" y2="520"/>
        <line x1="750" y1="550" x2="780" y2="525"/>
        <line x1="755" y1="555" x2="785" y2="530"/>
      </g>
    </g>

    <!-- Grey Jute Sling Bag with Sunflower -->
    <g id="sling-bag">
      <!-- Bag Strap -->
      <path d="M 850 435 Q 810 520 760 630" stroke="#64748b" stroke-width="14" fill="none" stroke-linecap="round"/>
      <!-- Bag Body -->
      <path d="
        M 720 630
        C 690 660 670 710 680 760
        C 690 800 730 820 780 800
        C 810 780 830 730 810 680
        C 790 640 760 620 720 630 Z"
        fill="url(#bagGrey)" stroke="#374151" stroke-width="2"
      />
      <!-- Knitted Cross-Hatch Bag Pattern -->
      <path d="M 690 690 L 800 760 M 700 740 L 780 670 M 710 770 L 770 700" stroke="#9ca3af" stroke-width="2" opacity="0.6"/>

      <!-- Bright Yellow Sunflower -->
      <g id="sunflower" transform="translate(735, 625)">
        <!-- Green Leaves -->
        <path d="M -5 10 Q -25 35 -15 65 Q 10 45 -5 10 Z" fill="#4d7c0f"/>
        <!-- Sunflower Golden Petals -->
        <circle cx="20" cy="15" r="16" fill="#ca8a04"/>
        <g fill="#facc15" stroke="#eab308" stroke-width="1">
          <ellipse cx="20" cy="-6" rx="6" ry="14"/>
          <ellipse cx="20" cy="36" rx="6" ry="14"/>
          <ellipse cx="-1" cy="15" rx="14" ry="6"/>
          <ellipse cx="41" cy="15" rx="14" ry="6"/>
          <ellipse cx="6" cy="1" rx="8" ry="14" transform="rotate(-45 6 1)"/>
          <ellipse cx="34" cy="29" rx="8" ry="14" transform="rotate(-45 34 29)"/>
          <ellipse cx="34" cy="1" rx="8" ry="14" transform="rotate(45 34 1)"/>
          <ellipse cx="6" cy="29" rx="8" ry="14" transform="rotate(45 6 29)"/>
        </g>
        <!-- Center Dark Seed Core -->
        <circle cx="20" cy="15" r="12" fill="#451a03"/>
        <circle cx="20" cy="15" r="8" fill="#78350f"/>
      </g>
    </g>

    <!-- Graceful Neck, Collarbone & Face -->
    <g id="face-and-neck">
      <!-- Neck -->
      <path d="
        M 930 410
        Q 940 460 970 480
        L 1040 470
        Q 1045 420 1025 390 Z"
        fill="url(#skinTone)"
      />
      <!-- Collarbone definition line -->
      <path d="M 975 465 Q 1005 478 1030 465" stroke="#ea580c" stroke-width="1.5" fill="none" opacity="0.6"/>

      <!-- Face Jawline & Chin -->
      <path d="
        M 915 360
        Q 930 420 975 425
        Q 1025 410 1040 350
        Q 1030 310 985 310
        Q 925 310 915 360 Z"
        fill="url(#skinTone)"
      />

      <!-- Subtle Nostalgic Black Bindi -->
      <circle cx="952" cy="344" r="2.2" fill="#09090b"/>

      <!-- Expressive Almond Eyes & Brows -->
      <!-- Left Eye -->
      <path d="M 932 355 Q 945 348 958 355" stroke="#09090b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="945" cy="356" rx="5" ry="4" fill="#1c1917"/>
      <circle cx="943" cy="354" r="1.5" fill="#ffffff"/>
      <!-- Left Eyebrow -->
      <path d="M 928 344 Q 942 338 956 345" stroke="#18181b" stroke-width="2.2" fill="none" stroke-linecap="round"/>

      <!-- Right Eye -->
      <path d="M 972 356 Q 986 350 998 358" stroke="#09090b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="985" cy="357" rx="5" ry="4" fill="#1c1917"/>
      <circle cx="983" cy="355" r="1.5" fill="#ffffff"/>
      <!-- Right Eyebrow -->
      <path d="M 972 346 Q 985 340 999 347" stroke="#18181b" stroke-width="2.2" fill="none" stroke-linecap="round"/>

      <!-- Nose -->
      <path d="M 964 350 Q 968 372 960 376 Q 965 379 972 376" stroke="#c2410c" stroke-width="1.8" fill="none" stroke-linecap="round"/>

      <!-- Lips with Soft Rose Red Tone -->
      <path d="M 952 390 Q 964 386 976 391 Q 964 397 952 390 Z" fill="#e11d48"/>
      <path d="M 955 391 Q 964 399 973 392" stroke="#be123c" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Dark Wavy Hair in Loose Romantic Bun -->
    <g id="hair">
      <path d="
        M 890 350
        C 885 280 940 240 1000 245
        C 1070 250 1100 290 1090 360
        C 1070 380 1045 370 1035 340
        C 1015 310 970 310 935 330
        C 915 340 900 370 890 350 Z"
        fill="url(#hairDark)"
      />
      <!-- Soft Tendrils & Fringe on Forehead -->
      <path d="M 920 310 Q 910 350 905 390" stroke="#09090b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 1030 330 Q 1045 370 1050 410" stroke="#09090b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Traditional Silver Oxidized Jhumka Earrings -->
    <g id="jhumka-earrings">
      <!-- Left Ear Jhumka -->
      <g transform="translate(900, 385)">
        <circle cx="0" cy="0" r="3.5" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
        <path d="M -7 10 Q 0 4 7 10 L 6 18 Q 0 20 -6 18 Z" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
        <!-- Dangling Pearls / Bells -->
        <circle cx="-5" cy="22" r="1.8" fill="#e2e8f0"/>
        <circle cx="0" cy="23" r="1.8" fill="#e2e8f0"/>
        <circle cx="5" cy="22" r="1.8" fill="#e2e8f0"/>
      </g>

      <!-- Right Ear Jhumka with Turquoise Bead Accent -->
      <g transform="translate(1045, 395)">
        <circle cx="0" cy="0" r="4" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
        <polygon points="-7,10 0,3 7,10 5,20 -5,20" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.2"/>
        <circle cx="-4" cy="24" r="2" fill="#e2e8f0"/>
        <circle cx="0" cy="25" r="2" fill="#e2e8f0"/>
        <circle cx="4" cy="24" r="2" fill="#e2e8f0"/>
      </g>
    </g>

  </g>

  <!-- Ambient Light Overlay & Vignette -->
  <radialGradient id="vignetteGlow" cx="50%" cy="50%" r="70%">
    <stop offset="65%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#05070c" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignetteGlow)" pointer-events="none"/>
</svg>
